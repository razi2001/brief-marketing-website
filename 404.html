<style>
  :root{
    --cream:#f5f1e8; --ink:#1a1612; --ink-2:#3a3530; --muted:#8a8378; --acc:#dd6936;
    --display:'Instrument Serif',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{margin:0; box-sizing:border-box}
  body{background:var(--cream); color:var(--ink); font-family:var(--mono);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center; padding:24px; position:relative; overflow:hidden}

  .cloud{position:absolute; pointer-events:none; opacity:.55; width:200px}
  .cloud svg{display:block; width:100%}
  .cl-1{top:14%; left:8%; animation:drift 80s linear infinite}
  .cl-2{top:22%; right:10%; width:160px; opacity:.4; animation:drift 110s -40s linear infinite}
  @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(40px)}}

  .logo{width:54px; height:54px; border-radius:14px; box-shadow:0 2px 8px rgba(26,22,18,.2); position:relative; z-index:2}
  h1{font-family:var(--display); font-weight:400; font-size:clamp(48px,9vw,84px); line-height:1; color:var(--ink); position:relative; z-index:2}
  h1 em{font-style:italic; color:var(--acc); position:relative; display:inline-block}
  h1 em .uline{position:absolute; left:-4px; right:-4px; bottom:-2px; width:calc(100% + 8px); height:8px; pointer-events:none}
  h1 em .uline path{stroke:var(--acc); stroke-width:2; fill:none; stroke-linecap:round;
    stroke-dasharray:160; stroke-dashoffset:160; animation:draw 1.2s .5s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  p{color:var(--ink-2); font-size:15px; position:relative; z-index:2; max-width:38ch; line-height:1.6}
  a.btn{display:inline-flex; align-items:center; gap:8px; margin-top:8px; background:var(--ink); color:var(--cream);
    text-decoration:none; font-size:14px; font-weight:500; padding:13px 20px; border-radius:11px;
    box-shadow:0 3px 0 var(--acc); transition:transform .15s, box-shadow .15s, background .15s; position:relative; z-index:2}
  a.btn:hover{background:#000; transform:translate(-1px,-2px); box-shadow:0 5px 0 var(--acc)}

  @media (prefers-reduced-motion: reduce){
    .cloud{animation:none}
    h1 em .uline path{animation:none; stroke-dashoffset:0}
  }
</style>
